# Docker: the repository folder is mounted at /repo; per-EHR values come from the environment (see docker-compose.yml):
# FHIR_ROOT_URL, DB_HOST, DB_NAME, JWKS_PATH, SHC_SIGNING_KEY_ID, AUTHZ_SERVER_ROOT_URL
include classpath("application.conf")

fhir.initialization {
  conformance-path = "/repo/fhir-conf/capabilitystatement.json"
  parameters-path = "/repo/fhir-conf/searchparameter/"
  compartments-path = "/repo/fhir-conf/compartment/"
  operations-path = "/repo/fhir-conf/operation/"
  stage-valuesets-path = "/repo/fhir-conf/valueset/"
  stage-questionnaires-path = "/repo/fhir-conf/questionnaire/"
}

fhir.authorization {
  resource-server-metadata-path = "/repo/fhir-conf/protected-resource-server-metadata.json"
  resource-server-jwks-path = "/repo/fhir-conf/jwks.json"
  authz-server-metadata-path = "/repo/fhir-conf/authorization-server-metadata.json"
  smart-configuration-path = "/repo/fhir-conf/smart-configuration.json"
  authz-server-url = "https://kroniq.srdc.com.tr/stage-onauth/api/smart"
}

# Secrets (gitignored, see fhir-conf/secrets.conf.example)
include file("/repo/fhir-conf/secrets.conf")
