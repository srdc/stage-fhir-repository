  "30700" = "http://loinc.org|33914-3"      # eGFR

  # Laboratory - Liver
  "30650" = "http://loinc.org|1742-6"       # ALT
  "30610" = "http://loinc.org|1751-7"       # Albumin

  # Social History - Smoking
  "20116" = "http://loinc.org|72166-2"      # Smoking status
  "3456"  = "http://loinc.org|64234-8"      # Cigarettes per day

  # Social History - Alcohol
  "20117" = "http://loinc.org|74013-4"      # Alcohol status
