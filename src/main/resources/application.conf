# STAGE FHIR Repository configuration (STAGE by default; see application-ehr.conf for the second repository, EHR)
# All paths are relative to the working directory (run from the repository root) or absolute.

server {
  # Bind address; 0.0.0.0 binds to localhost and the IP of the host
  host = 0.0.0.0
  port = 8080
  # Base path: http://<host>:<port>/fhir
  base-uri = fhir
  ssl {
    keystore = null
    password = null
  }
  internal {
    active = true
    port = 8081
    authenticate = false
  }
}

fhir {
  # Store the conformance resources of fhir-conf at startup (set false to use the ones already in the database)
  initialize = true
  # Public root URL of the repository (also the SMART Health Card issuer: verifiers read <root-url>/.well-known/jwks.json)
  root-url = "http://127.0.0.1:8080/fhir"
  definitions-url = null
  validation = "profile"
  search-handling = "handling=strict"

  initialization {
    base-definitions-path = null
    conformance-path = "./fhir-conf/capabilitystatement.json"
    profiles-path = null
    parameters-path = "./fhir-conf/searchparameter/"
    compartments-path = "./fhir-conf/compartment/"
    valuesets-path = null
    codesystems-path = null
    operations-path = "./fhir-conf/operation/"
    index-conf-path = null
    # STAGE resources stored at startup (created if missing, updated if changed)
    stage-valuesets-path = "./fhir-conf/valueset/"
    stage-questionnaires-path = "./fhir-conf/questionnaire/"
  }

  default {
    return-preference = representation
    page-count = 20
    versioning = "versioned"
    read-history = false
    update-create = true
    conditional-create = false
    conditional-update = false
    conditional-delete = "not-supported"
  }

  # SMART Health Cards ($health-cards-issue)
  health-cards {
    # Patient elements put into a card when the request has no includeIdentityClaim
    default-identity-claims = ["Patient.name", "Patient.birthDate", "Patient.gender"]
    # Levels of references followed from a Composition (credentialType Composition or #ips)
    composition-reference-depth = 2
    # kid of the ES256 signing key in resource-server-jwks-path; each EHR (issuer) has its own key
    signing-key-id = "Fd_ncCoG4zYPoNit-tYEQ4YLQzraKqQ-kH1r8PN9TW0"
  }

  authorization {
    # none | smart-on-fhir (the launch context patient of the token is in the authorization context)
    method = "smart-on-fhir"
    token-resolution = "jwt"
    token-resolution-signature-algorithm = "HS256"
    authz-server-dynamic-registration = false
    resource-server-metadata-path = "./fhir-conf/protected-resource-server-metadata.json"
    # Keys of this repository: the private EC key signs SMART Health Cards, the public part is served at /.well-known/jwks.json
    resource-server-jwks-path = "./fhir-conf/jwks.json"
    authz-server-discovery = "none"
    authz-server-metadata-path = "./fhir-conf/authorization-server-metadata-local.json"
    smart-configuration-path = "./fhir-conf/smart-configuration-local.json"
    authz-server-url = "http://localhost:8091/onauth/api/smart"
    token-caching-max-capacity = 1000
    token-caching-initial-capacity = 100
    token-caching-time-to-live = 30
    token-caching-time-to-idle = 10
  }

  auditing {
    repository = "local"
  }

  subscription {
    active = false
  }
}

akka {
  stdout-loglevel = "OFF"
  loglevel = "OFF"
  actor {
    deployment {
      "/**" {
        dispatcher = "akka.actor.onfhir-blocking-dispatcher"
      }
    }
    onfhir-blocking-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 32
      }
      throughput = 1
    }
  }
}

# akka-http timeouts for the long-running onfhir-feast $retrieve-feature-values call of the CDS services (one job can
# take > 60 s): no client retries (every retry of the GET started a new, parallel onfhir-feast job) and long client
# idle timeouts. On the server side, the CDS endpoints get a 320 s request timeout of their own (CdsModule) while
# the FHIR API keeps akka.http.server.request-timeout; the idle timeout must cover the longest request.
akka.http {
  server {
    server-header = OnFhir.io FHIR Repository
    parsing {
      uri-parsing-mode = relaxed
    }
    request-timeout = 60 s
    idle-timeout = 340 s
    remote-address-header = on
  }
  client.idle-timeout = 330s
  host-connection-pool {
    max-retries = 0
    client.idle-timeout = 330s
  }
}

kafka {
  enabled = false
  host = localhost
  port = 9092
  topic = raw.fhir
  client.id = onfhir
  bootstrap-servers = ["localhost:9092"]
}

mongodb {
  embedded = false
  host = ["localhost:27017"]
  # One database per EHR
  db = stage
  sharding = false
  transaction = false
  pooling {
    minSize = 5
    maxSize = 200
    maxWaitTime = 180
    maxConnectionLifeTime = 1200
  }
}

