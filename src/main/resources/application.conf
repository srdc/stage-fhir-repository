# ML (shap-client) service of risk_prediction / shap_explain
ml-service {
  url = "http://localhost:8001"
  url = ${?ML_SERVICE_URL}
  timeout = 30s
}

# onfhir-feast service used by:
#  - risk_prediction_form, to retrieve a pre-filled QuestionnaireResponse (from stage_wp6_features) for the
#    user to review, via the $retrieve-feature-values operation, instead of manually mapping FHIR prefetch
#    resources.
#  - risk_prediction, to retrieve the model-ready feature values (from stage_wp6_model_features, which reads
#    ONLY from the QuestionnaireResponse the user has already reviewed and saved) before running the ML model.
onfhir-feast-service {
  url = "http://localhost:8085/onfhir-feast/api"
  url = ${?ONFHIR_FEAST_URL}
  dataSourceId = "myFhirServer"
  dataSourceId = ${?ONFHIR_FEAST_DATA_SOURCE_ID}
  featureSetId = "stage_wp6_features"
  featureSetId = ${?ONFHIR_FEAST_FEATURE_SET_ID}
  modelFeatureSetId = "stage_wp6_model_features"
  modelFeatureSetId = ${?ONFHIR_FEAST_MODEL_FEATURE_SET_ID}
  timeout = 300s
}

# UK Biobank to FHIR Observation Code Mappings (risk_prediction_form)
uk-biobank-direct-mapping {
  # Anthropometry
  "21001" = "http://loinc.org|39156-5"      # BMI
  "50"    = "http://loinc.org|8302-2"       # Height
  "21002" = "http://loinc.org|29463-7"      # Weight
  "48"    = "http://loinc.org|56086-2"      # Waist circumference
  "49"    = "http://loinc.org|62409-8"      # Hip circumference

  # Vital Signs
  "4080"  = "http://loinc.org|8480-6"       # Systolic BP
  "4079"  = "http://loinc.org|8462-4"       # Diastolic BP
  "102"   = "http://loinc.org|8867-4"       # Heart rate

  # Laboratory - Lipids
  "30690" = "http://loinc.org|2093-3"       # Total Cholesterol
  "30760" = "http://loinc.org|2085-9"       # HDL
  "30780" = "http://loinc.org|18262-6"      # LDL
  "30870" = "http://loinc.org|2571-8"       # Triglycerides

  # Laboratory - Glucose/Diabetes
