# Two separate repositories for the SMART Health Cards/Links (xShare) tests, each with its own FHIR repository
# (database, signing key) and SMART Health Links server.
# Build the image first: mvn clean install && docker build -t nexus.srdc.com.tr:18445/stage/fhir-repository .
#   STAGE: FHIR http://localhost:8080/fhir   SHL http://localhost:3000
#   EHR:   FHIR http://localhost:8180/fhir   SHL http://localhost:3001
# Deployment on kroniq.srdc.com.tr: deploy/kroniq
volumes:
  mongodata:
    driver: local
  shl-data-stage:
  shl-data-ehr:

services:
  stage-mongo:
    image: library/mongo:4.4
    container_name: stage-mongo
    volumes:
      - mongodata:/data/db
    restart: always

  stage-fhir:
    image: nexus.srdc.com.tr:18445/stage/fhir-repository
    container_name: stage-fhir
    depends_on:
      - stage-mongo
    ports:
      - 8080:8080
    environment:
      - APP_CONF_FILE=/repo/application-docker.conf
      - DB_HOST=stage-mongo
      - DB_NAME=stage
      - FHIR_ROOT_URL=http://localhost:8080/fhir
      - JWKS_PATH=/repo/fhir-conf/jwks.json
      - SHC_SIGNING_KEY_ID=Fd_ncCoG4zYPoNit-tYEQ4YLQzraKqQ-kH1r8PN9TW0
    volumes:
      - ./:/repo
    restart: always

  ehr-fhir:
    image: nexus.srdc.com.tr:18445/stage/fhir-repository
    container_name: ehr-fhir
    depends_on:
      - stage-mongo
    ports:
      - 8180:8080
    environment:
      - APP_CONF_FILE=/repo/application-docker.conf
      - DB_HOST=stage-mongo
      - DB_NAME=ehr
      - FHIR_ROOT_URL=http://localhost:8180/fhir
      - JWKS_PATH=/repo/fhir-conf/jwks-ehr.json
      - SHC_SIGNING_KEY_ID=ctJZJqbAj5pk3kj3DRR2woQgIu-fXVH5hTQm8skB880
    volumes:
      - ./:/repo
    restart: always

  stage-shl:
    image: nexus.srdc.com.tr:18445/stage/shl-server
    container_name: stage-shl
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - PUBLIC_BASE_URL=http://localhost:3000
    volumes:
      - shl-data-stage:/home/node/app/shc
    restart: always

  shl-ehr:
    image: nexus.srdc.com.tr:18445/stage/shl-server
    container_name: shl-ehr
    ports:
      - 3001:3000
    environment:
      - NODE_ENV=production
      - PUBLIC_BASE_URL=http://localhost:3001
    volumes:
      - shl-data-ehr:/home/node/app/shc
    restart: always
