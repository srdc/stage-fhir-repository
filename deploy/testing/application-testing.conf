# The repositories on https://stage.testing.eu (docker-compose.yml): application-docker.conf, with the onAuth metadata
# of stage.testing.eu (written by setup.sh into local/fhir-conf, mounted at /testing/fhir-conf)
include file("/repo/application-docker.conf")

fhir.authorization {
  authz-server-metadata-path = "/testing/fhir-conf/authorization-server-metadata.json"
  smart-configuration-path = "/testing/fhir-conf/smart-configuration.json"
  authz-server-url = "https://stage.testing.eu/stage-onauth/api/smart"
}

# ML services of the CDS services, by default on the host (docker-compose.yml: host.docker.internal)
ml-service.url = ${?ML_SERVICE_URL}
llm-service.baseUrl = ${?LLM_SERVICE_URL}
onfhir-feast-service.url = ${?ONFHIR_FEAST_URL}
