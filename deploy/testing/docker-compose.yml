# Local simulation of the STAGE server on https://stage.testing.eu (127.0.0.1 in the Windows hosts file), with the same
# paths as https://kroniq.srdc.com.tr (deploy/kroniq): STAGE and EHR repositories (FHIR, CDS Hooks and SMART Health
# Links), onAuth and the smart-apps, behind an nginx with a mkcert certificate. See README.md.
#   ./setup.sh                      (once: certificate, onAuth configuration, .env)
#   docker compose up -d
# fhir-conf, cds-conf and application-docker.conf of this repository are mounted (the private keys never go into an
# image); setup.sh writes the stage.testing.eu variants of the host specific files into ./local (gitignored).
name: stage-testing

volumes:
  mongo-data:
  onauth-redis-data:
  node-shl-data:
  rag-redis-data:
  rag-chroma:
  rag-hf-cache:
  feast-output-data:
  postgres-data:

networks:
  stage-testing:

x-fhir: &fhir
  image: ${FHIR_IMAGE:-stage/fhir-repository:testing}
  depends_on:
    - mongo
  volumes:
    - type: bind
      source: ../../fhir-conf
      target: /repo/fhir-conf
      read_only: true
    - type: bind
      source: ../../cds-conf
      target: /repo/cds-conf
      read_only: true
    - type: bind
      source: ../../application-docker.conf
      target: /repo/application-docker.conf
      read_only: true
    - type: bind
      source: ./application-testing.conf
      target: /testing/application-testing.conf
      read_only: true
    - type: bind
      source: ./local/fhir-conf
      target: /testing/fhir-conf
      read_only: true
  extra_hosts:
    # the ML services, if they run on the host instead (ML_SERVICE_URL etc. in .env)
    - host.docker.internal:host-gateway
  restart: unless-stopped
  networks:
    - stage-testing

x-shl: &shl
  image: ${SHL_IMAGE:-nexus.srdc.com.tr:18445/stage/shl-server:latest}
  restart: unless-stopped
  networks:
    - stage-testing

services:
  mongo:
    image: library/mongo:4.4
    container_name: stage-testing-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      # for inspecting the data (mongosh mongodb://127.0.0.1:27117)
      - 127.0.0.1:27117:27017
    restart: unless-stopped
    networks:
      - stage-testing

  stage-fhir:
    <<: *fhir
    container_name: stage-testing-stage-fhir
    environment:
      - APP_CONF_FILE=/testing/application-testing.conf
      - DB_HOST=mongo
      - DB_NAME=stage
      - FHIR_ROOT_URL=https://stage.testing.eu/stage-fhir
      - AUTHZ_SERVER_ROOT_URL=https://stage.testing.eu/stage-onauth/api/smart
      - JWKS_PATH=/repo/fhir-conf/jwks.json
      - SHC_SIGNING_KEY_ID=Fd_ncCoG4zYPoNit-tYEQ4YLQzraKqQ-kH1r8PN9TW0
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://shap-client:8001}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL:-http://fhir-rag-med:8000}
      - ONFHIR_FEAST_URL=${ONFHIR_FEAST_URL:-http://onfhir-feast:8085/onfhir-feast/api}
      # onfhir-feast data source of this repository (local/onfhir-feast/application.conf)
      - ONFHIR_FEAST_DATA_SOURCE_ID=stageFhir
      # SMART Health Links of this repository: nginx maps /stage-shl/shl/... to <server>/shl/...
      - SHL_PUBLIC_BASE_URL=https://stage.testing.eu/stage-shl
    ports:
      # direct access, bypassing nginx (same port as deploy/kroniq)
      - 127.0.0.1:7702:8080

  ehr-fhir:
    <<: *fhir
    container_name: stage-testing-ehr-fhir
    environment:
      - APP_CONF_FILE=/testing/application-testing.conf
      - DB_HOST=mongo
      - DB_NAME=ehr
      - FHIR_ROOT_URL=https://stage.testing.eu/ehr
      - AUTHZ_SERVER_ROOT_URL=https://stage.testing.eu/stage-onauth/api/smart
      - JWKS_PATH=/repo/fhir-conf/jwks-ehr.json
      - SHC_SIGNING_KEY_ID=ctJZJqbAj5pk3kj3DRR2woQgIu-fXVH5hTQm8skB880
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://shap-client:8001}
      - LLM_SERVICE_URL=${LLM_SERVICE_URL:-http://fhir-rag-med:8000}
      - ONFHIR_FEAST_URL=${ONFHIR_FEAST_URL:-http://onfhir-feast:8085/onfhir-feast/api}
      - ONFHIR_FEAST_DATA_SOURCE_ID=ehrFhir
      - SHL_PUBLIC_BASE_URL=https://stage.testing.eu/shl-ehr
    ports:
      - 127.0.0.1:7707:8080

  # The former Node shl-server, replaced by the repositories' SMART Health Links: only as the reference of the
  # conformance tests (shl-conformance, SHL_REFERENCE_URL=https://stage.testing.eu/node-shl).
  #   docker compose --profile shl-reference up -d node-shl
  node-shl:
    <<: *shl
    container_name: stage-testing-node-shl
    profiles: [shl-reference]
    environment:
      - NODE_ENV=production
      - PUBLIC_BASE_URL=https://stage.testing.eu/node-shl
      - TRUST_PROXY=1
    volumes:
      - node-shl-data:/home/node/app/shc

  onauth-redis:
    image: library/redis:5.0
    container_name: stage-testing-onauth-redis
    command: redis-server --appendonly yes
    volumes:
      - onauth-redis-data:/data
    restart: unless-stopped
    networks:
      - stage-testing

  stage-onauth:
    # built from the stage-onauth checkout (docker build -t stage/onauth:testing .): its entrypoint points the
    # onauth-manager paths to /stage-onauth, which the nexus image (2026-10-06) does not do yet
    image: ${ONAUTH_IMAGE:-stage/onauth:testing}
    container_name: stage-testing-onauth
    depends_on:
      - mongo
      - onauth-redis
    environment:
      - DB_HOST=mongo
      - REDIS_HOST=onauth-redis
      # written by setup.sh from stage-onauth/conf (realm smart, host stage.testing.eu)
      - APP_CONF_FILE=/sps/conf/application-testing.conf
      # smart context resolution reads the patients from the STAGE repository
      - FHIR_HOST=http://stage-fhir:8080/fhir
      - AUDIT_HOST=http://stage-fhir:8080/fhir
      - ONAUTH_SERVER_NAME=stage.testing.eu
      - ONAUTH_SERVER_PATH=stage-onauth
      - ONAUTH_SERVER_PROTOCOL=https
      - DOCKER_CONTAINER_HOST=stage-onauth
      - REDIRECT_MANAGER_RELATIVE=true
    volumes:
      - type: bind
        source: ./local/onauth
        target: /sps
    restart: unless-stopped
    networks:
      - stage-testing

  # ML services of the CDS services, from their checkouts next to this repository (mounted read-only, so a restart picks
  # up changes): shap-client (risk prediction, SHAP), fhir-rag-med (LLM explanations, chat), onfhir-feast (features)
  shap-client:
    image: ${SHAP_CLIENT_IMAGE:-stage/shap-client:testing}
    container_name: stage-testing-shap-client
    volumes:
      - type: bind
        source: ${SHAP_CLIENT_DIR:-../../../shap-client}
        target: /app
        read_only: true
    restart: unless-stopped
    networks:
      - stage-testing

  rag-redis:
    image: library/redis:7-alpine
    container_name: stage-testing-rag-redis
    command: redis-server --appendonly yes
    volumes:
      - rag-redis-data:/data
    restart: unless-stopped
    networks:
      - stage-testing

  fhir-rag-med:
    # built from the fhir-rag-med checkout (docker build -t fhir-rag-med .); its src is mounted over the image's
    image: ${FHIR_RAG_MED_IMAGE:-fhir-rag-med:latest}
    container_name: stage-testing-fhir-rag-med
    depends_on:
      - rag-redis
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://rag-redis:6379/0
    volumes:
      - type: bind
        source: ${FHIR_RAG_MED_DIR:-../../../../SRDC/fhir-rag-med}/src
        target: /app/src
        read_only: true
      - type: bind
        source: ${FHIR_RAG_MED_DIR:-../../../../SRDC/fhir-rag-med}/data/shap
        target: /app/data/shap
        read_only: true
      - rag-chroma:/app/chroma
      - rag-hf-cache:/root/.cache
    restart: unless-stopped
    networks:
      - stage-testing

  # PostgreSQL of the services (onfhir-feast: database onfhir_feast); password written by setup.sh
  postgres:
    image: library/postgres:16
    container_name: stage-testing-postgres
    environment:
      - POSTGRES_DB=onfhir_feast
      - POSTGRES_PASSWORD_FILE=/run/postgres.secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./local/postgres.secret
        target: /run/postgres.secret
        read_only: true
    ports:
      # for inspecting the data (psql -h 127.0.0.1 -p 15432 -U postgres)
      - 127.0.0.1:15432:5432
    restart: unless-stopped
    networks:
      - stage-testing

  onfhir-feast:
    image: library/eclipse-temurin:11-jre
    container_name: stage-testing-onfhir-feast
    depends_on:
      - postgres
      - stage-fhir
      - ehr-fhir
      - stage-onauth
    working_dir: /usr/local/onfhir-feast
    command: java -Xms512m -Xmx4g -Dconfig.file=/testing/onfhir-feast/application.conf -jar onfhir-feast-standalone.jar
    volumes:
      # built in the onfhir-feast checkout (mvn package)
      - type: bind
        source: ${ONFHIR_FEAST_DIR:-../../../../SRDC/onfhir-feast}/onfhir-feast-server/target/onfhir-feast-standalone.jar
        target: /usr/local/onfhir-feast/onfhir-feast-standalone.jar
        read_only: true
      - type: bind
        source: ${ONFHIR_FEAST_DIR:-../../../../SRDC/onfhir-feast}/definitions
        target: /usr/local/onfhir-feast/definitions
        read_only: true
      # written by setup.sh: the data sources of the repositories (with the stage-services secret)
      - type: bind
        source: ./local/onfhir-feast
        target: /testing/onfhir-feast
        read_only: true
      - feast-output-data:/data/output-data
    restart: unless-stopped
    networks:
      - stage-testing

  smart-apps:
    image: ${SMART_APPS_IMAGE:-srdc/smart-apps:testing}
    container_name: stage-testing-smart-apps
    environment:
      - SERVER_NAME=stage.testing.eu
      - SERVER_PATH=/smart-apps/
    restart: unless-stopped
    networks:
      - stage-testing

  nginx:
    image: library/nginx:1.27
    container_name: stage-testing-nginx
    depends_on:
      - stage-fhir
      - ehr-fhir
      - stage-onauth
      - smart-apps
    volumes:
      - type: bind
        source: ./nginx/stage.testing.eu.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./local/certs
        target: /etc/nginx/certs
        read_only: true
    ports:
      - 127.0.0.1:443:443
      - 127.0.0.1:80:80
    restart: unless-stopped
    networks:
      stage-testing:
        # the containers reach the public host name through nginx as well
        aliases:
          - stage.testing.eu
