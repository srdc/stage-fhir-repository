# https://stage.testing.eu: the locations of kroniq.srdc.com.tr (deploy/kroniq/nginx-locations.conf), with the
# containers of docker-compose.yml instead of the 127.0.0.1 ports.
# The CDS services of each repository are under its FHIR base: /stage-fhir/cds-hooks, /ehr/cds-hooks.

server {
    listen 80;
    server_name stage.testing.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stage.testing.eu;

    ssl_certificate     /etc/nginx/certs/stage.testing.eu.pem;
    ssl_certificate_key /etc/nginx/certs/stage.testing.eu-key.pem;

    client_max_body_size 25M;
    # the risk prediction CDS services may take minutes (onfhir-feast)
    proxy_read_timeout 330s;

    # Resolve the containers when they are used, so that nginx starts while some are (re)starting
    resolver 127.0.0.11 valid=10s;
    set $stage_fhir   http://stage-fhir:8080;
    set $ehr_fhir     http://ehr-fhir:8080;
    set $node_shl     http://node-shl:3000;
    set $stage_onauth http://stage-onauth:80;
    set $smart_apps   http://smart-apps:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /stage-fhir/... -> /fhir/... (with variables, proxy_pass does not replace the prefix itself)
    location /stage-fhir {
        rewrite ^/stage-fhir(.*)$ /fhir$1 break;
        proxy_pass $stage_fhir;
    }

    location /ehr {
        rewrite ^/ehr(.*)$ /fhir$1 break;
        proxy_pass $ehr_fhir;
    }

    # SMART Health Links of each repository: /stage-shl/shl/... -> <server>/shl/... (only /shl, not the FHIR API)
    location /stage-shl/shl {
        rewrite ^/stage-shl/(.*)$ /$1 break;
        proxy_pass $stage_fhir;
    }

    location /shl-ehr/shl {
        rewrite ^/shl-ehr/(.*)$ /$1 break;
        proxy_pass $ehr_fhir;
    }

    # the former Node shl-server, for the conformance tests only (docker compose --profile shl-reference)
    location /node-shl/ {
        rewrite ^/node-shl/(.*)$ /$1 break;
        proxy_pass $node_shl;
    }

    location /stage-onauth {
        proxy_pass $stage_onauth;
    }

    location /smart-apps {
        proxy_pass $smart_apps;
    }

    location = / {
        return 302 /smart-apps/dashboard/;
    }
}
