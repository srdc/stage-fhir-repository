# STAGE and EHR repositories on https://kroniq.srdc.com.tr, behind the host's nginx (see nginx-locations.conf).
# Each: its own FHIR repository (database, SMART Health Card signing key, issuer = public root URL) and SHL server.
# EHR is the second repository for the xShare (SMART Health Cards/Links) tests.
#   docker compose --env-file .env up -d
# Replaces the old compose (stage-repo + stage-repo-mongo): same network, resource limits, MongoDB container and volume.
# fhir-conf (keys, metadata, ValueSets...), cds-conf (CDS Hooks definitions and data) and application-docker.conf of this repository are mounted from REPO_DIR
# (.env), so the private keys never go into an image.
name: stage-fhir

volumes:
  # the MongoDB data of the old compose, reused (external: not created or deleted by this compose)
  vstagerepomongo:
    external: true
    name: ${STAGE_MONGO_VOLUME}
  stage-shl-data:
  shl-ehr-data:

networks:
  stage-network:
    external: true

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: "4G"

x-fhir: &fhir
  <<: *limits
  image: ${FHIR_IMAGE}
  depends_on:
    - stage-repo-mongo
  # bind mounts fail if the host path is missing, instead of Docker creating an empty directory in its place
  volumes:
    - type: bind
      source: ${REPO_DIR}/fhir-conf
      target: /repo/fhir-conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${REPO_DIR}/cds-conf
      target: /repo/cds-conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${REPO_DIR}/application-docker.conf
      target: /repo/application-docker.conf
      read_only: true
      bind:
        create_host_path: false
  restart: always
  networks:
    - stage-network

x-shl: &shl
  image: ${SHL_IMAGE}
  restart: always
  networks:
    - stage-network
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: "512M"

services:
  stage-repo-mongo:
    <<: *limits
    image: library/mongo:4.4
    container_name: stage-repo-mongo
    volumes:
      - vstagerepomongo:/data/db
    restart: always
    networks:
      - stage-network

  stage-fhir:
    <<: *fhir
    container_name: stage-fhir
    ports:
      - 127.0.0.1:${STAGE_FHIR_PORT}:8080
    environment:
      - APP_CONF_FILE=/repo/application-docker.conf
      - DB_HOST=stage-repo-mongo
      - DB_NAME=${STAGE_DB_NAME}
      # public URL: base of the Bundle links and the SMART Health Card issuer (keys at <root>/.well-known/jwks.json)
      - FHIR_ROOT_URL=${PUBLIC_HOST}${STAGE_FHIR_PATH}
      - JWKS_PATH=/repo/fhir-conf/jwks.json
      - SHC_SIGNING_KEY_ID=Fd_ncCoG4zYPoNit-tYEQ4YLQzraKqQ-kH1r8PN9TW0

  ehr-fhir:
    <<: *fhir
    container_name: ehr-fhir
    ports:
      - 127.0.0.1:${EHR_FHIR_PORT}:8080
    environment:
      - APP_CONF_FILE=/repo/application-docker.conf
      - DB_HOST=stage-repo-mongo
      - DB_NAME=${EHR_DB_NAME}
      - FHIR_ROOT_URL=${PUBLIC_HOST}${EHR_FHIR_PATH}
      - JWKS_PATH=/repo/fhir-conf/jwks-ehr.json
      - SHC_SIGNING_KEY_ID=ctJZJqbAj5pk3kj3DRR2woQgIu-fXVH5hTQm8skB880

  stage-shl:
    <<: *shl
    container_name: stage-shl
    ports:
      - 127.0.0.1:${STAGE_SHL_PORT}:3000
    environment:
      - NODE_ENV=production
      # manifest URLs in the links are built from it (keep under 128 characters with /shl/<id>/m)
      - PUBLIC_BASE_URL=${PUBLIC_HOST}${STAGE_SHL_PATH}
      # nginx on the host: client IPs from X-Forwarded-For (rate limits, passcode attempts)
      - TRUST_PROXY=1
    volumes:
      - stage-shl-data:/home/node/app/shc

  shl-ehr:
    <<: *shl
    container_name: shl-ehr
    ports:
      - 127.0.0.1:${EHR_SHL_PORT}:3000
    environment:
      - NODE_ENV=production
      - PUBLIC_BASE_URL=${PUBLIC_HOST}${EHR_SHL_PATH}
      - TRUST_PROXY=1
    volumes:
      - shl-ehr-data:/home/node/app/shc
