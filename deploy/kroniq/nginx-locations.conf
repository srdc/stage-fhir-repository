  # --- STAGE / EHR repositories and SMART Health Links servers (stage-fhir-repository/deploy/kroniq) ---
  # In the `server_name kroniq.srdc.com.tr;` block on port 443. Replace the existing /stage-fhir and /stage-shl
  # locations with these: /stage-shl must strip its prefix (the SHL server serves /shl/...).

  location /stage-fhir {
      proxy_pass http://127.0.0.1:7702/fhir;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
  }

  location /stage-shl/ {
      proxy_pass http://127.0.0.1:7703/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ehr {
      proxy_pass http://127.0.0.1:7707/fhir;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
  }

  location /shl-ehr/ {
      proxy_pass http://127.0.0.1:7708/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  # onAuth of the STAGE repositories (realm smart), see stage-onauth compose
  location /stage-onauth {
      proxy_pass http://127.0.0.1:7709;
      proxy_set_header Host $host;
  }
