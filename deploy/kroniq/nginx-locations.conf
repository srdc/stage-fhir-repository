  # --- STAGE (stage-fhir-repository/deploy/kroniq) ---
  # In the `server_name kroniq.srdc.com.tr;` block on port 443, replacing the existing /smart-apps, /smart-cds/,
  # /stage-fhir, /stage-shl/, /ehr, /shl-ehr/ and /stage-onauth locations. Then: nginx -t && systemctl reload nginx
  # Removed: /smart-cds/ (the CDS services are at <FHIR base>/cds-hooks of the repository), the Node SHL servers
  # (/stage-shl/ on 7703, /shl-ehr/ on 7708; /stage-shl/shl/... goes to the repository's /shl/...) and the EHR
  # repository of the xShare demo (/ehr and /shl-ehr/shl on 7707)

  location /smart-apps {
      proxy_pass http://127.0.0.1:7700;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
  }

  location /stage-fhir {
      proxy_pass http://127.0.0.1:7702/fhir;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
  }

  location /stage-shl/shl {
      proxy_pass http://127.0.0.1:7702/shl;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /stage-onauth {
      proxy_pass http://127.0.0.1:7709;
      proxy_set_header Host $host;
  }
